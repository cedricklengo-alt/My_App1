name: mbote
description: MboteCall — Appelle le pays, comme si tu y etais.
publish_to: 'none'
version: 1.8.1+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  package_info_plus: 9.0.1  # épinglé : les versions 9.x cassent GeneratedPluginRegistrant (classe Java PackageInfoPlugin)
  sms_autofill: ^2.4.0  # Autofill OTP : SMS Retriever (Android) + Autofill (iOS), sans permission SMS
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.0
  http_parser: ^4.0.2 # type MIME explicite des fichiers envoyés
  shared_preferences: ^2.2.3
  flutter_contacts: ^1.1.9+2
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  video_player: ^2.9.2 # lecture des courtes vidéos dans le fil et les statuts
  flutter_webrtc: ^1.6.2 # vraie voix MboteCall
  flutter_ringtone_player: ^4.0.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  record: ^7.1.2 # 🗣️ Lokota : enregistrement des notes vocales
  audioplayers: ^6.8.1 # 🗣️ Lokota : écoute des notes vocales
  path_provider: ^2.1.5 # fichier temporaire d'enregistrement
  intl: ^0.20.3
  # ⚠️ Volontairement bloqué en 10.x : à partir de 11.0.0, le build.gradle du
  # plugin n'applique plus le Kotlin Gradle Plugin dès qu'il voit AGP ≥ 9, en
  # supposant que le « Built-in Kotlin » d'AGP 9 est actif. Or le gabarit Flutter
  # 3.47 met `android.builtInKotlin=false` : les sources Kotlin du plugin ne sont
  # alors jamais compilées et le build Android échoue sur
  # « cannot find symbol: FilePickerPlugin ». La 10.3.3 applique KGP comme les
  # autres plugins (firebase_core, share_plus…) et compile sans problème.
  file_picker: ^10.3.3
  # --- Architecture Local-First / Offline-First ---
  sqflite: ^2.4.1            # base de données locale (équivalent Room)
  connectivity_plus: ^6.1.2  # détection du retour d'Internet
  uuid: ^4.5.1               # identifiants locaux stables (idempotence)

dev_dependencies:
  sqflite_common_ffi: ^2.3.4 # permet d'exécuter les tests DB hors appareil
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/flags/
    - assets/icon/

# 🌅 Icône de l'app — générée avec : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#14100E"
  adaptive_icon_foreground: assets/icon/icon.png
